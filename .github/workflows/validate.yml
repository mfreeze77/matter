name: Validate Matter contracts and scaffold

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test constraints
        run: python -m pip install -e . -c requirements-test.txt
      - name: Check generated files
        run: python -m matter render --check
      - name: Validate contracts and roadmap
        run: python -m matter validate
      - name: Run behavioral regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify portable canonical vectors in JavaScript
        run: node tests/fixtures/canonical/verify.mjs
      - name: Run synthetic lifecycle walkthroughs
        run: python -m matter demo all
      - name: Verify installed contracts, storage, evidence, identity, occurrences, claims, and associations outside the checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/matter-wheel"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/matter-wheel/*.whl
          cp tests/fixtures/contracts/commands/create_matter.json "$RUNNER_TEMP/matter-create.json"
          cp examples/observation_intake.py "$RUNNER_TEMP/matter-observation-intake.py"
          cp examples/matter_identity.py "$RUNNER_TEMP/matter-identity.py"
          cp examples/occurrence_grouping.py "$RUNNER_TEMP/matter-occurrences.py"
          cp examples/claim_evidence.py "$RUNNER_TEMP/matter-claims.py"
          cp examples/association_acceptance.py "$RUNNER_TEMP/matter-associations.py"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          import sqlite3
          import tempfile
          from matter.contracts import decode_command, error_result, schema_for
          from matter.storage import SQLiteStore, entity_ref, pin

          for kind in ("record", "command", "result"):
              assert schema_for(kind)["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          result = error_result("ingest_observation", "wheel-check", "E_STORAGE_UNAVAILABLE")
          assert result["status"] == "failure"
          assert result["error"]["code"] == "E_STORAGE_UNAVAILABLE"
          assert files("matter.storage.migrations").joinpath("001_initial.sql").is_file()
          assert files("matter._schemas").joinpath("observation-source-index.schema.json").is_file()
          assert files("matter._schemas").joinpath("matter-identity-key.schema.json").is_file()
          for name in ("occurrence-key", "occurrence-membership", "provenance-root-assignment"):
              assert files("matter._schemas").joinpath(name + ".schema.json").is_file()
          for name in ("claim-index", "evidence-relation-index", "locator-validation", "text-line-selector"):
              assert files("matter._schemas").joinpath(name + ".schema.json").is_file()
          for name in ("candidate-set", "association-evaluation", "association-decision",
                       "association-disposition", "association-membership"):
              assert files("matter._schemas").joinpath(name + ".schema.json").is_file()
          command = decode_command(Path("matter-create.json").read_bytes())

          def create(tx):
              stored = tx.insert(tx.command["body"]["matter"])
              return tx.success("created", {"matter": pin(stored)})

          def must_not_execute(tx):
              raise AssertionError("A committed retry executed its handler.")

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              database = root / "matter.sqlite"
              with SQLiteStore(database, scope_id=command["scope_id"]) as store:
                  committed = store.execute(command, create)
                  assert committed["status"] == "success", committed
                  original = store.get(committed["body"]["matter"])
                  assert store.execute(command, must_not_execute) == committed
                  backup = store.backup_to(root / "backup.sqlite")
              with SQLiteStore(database, scope_id=command["scope_id"]) as restarted:
                  assert restarted.execute(command, must_not_execute) == committed
              with SQLiteStore.restore_from(backup, root / "restored.sqlite", scope_id=command["scope_id"]) as restored:
                  assert restored.get(entity_ref(original)) == original
                  assert restored.command_receipt(command["idempotency_key"])["result"] == committed
                  assert restored.execute(command, must_not_execute) == committed
          print(f"Installed schemas, migrations, transactions, restart and restore passed; SQLite {sqlite3.sqlite_version}.")
          PY
          python matter-observation-intake.py
          python matter-identity.py
          python matter-occurrences.py
          python matter-claims.py
          python matter-associations.py
