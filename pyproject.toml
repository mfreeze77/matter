[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-foundation"
version = "0.1.0.dev6"
description = "Portable contracts, durable evidence, continuing identity, scoped claims, and exact citations for Matter"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.scripts]
matter = "matter.__main__:main"

[tool.setuptools]
packages = ["matter", "matter._schemas", "matter.storage", "matter.storage.migrations"]

[tool.setuptools.package-dir]
"" = "src"
"matter._schemas" = "schemas"

[tool.setuptools.package-data]
"matter._schemas" = ["*.schema.json"]
"matter.storage.migrations" = ["*.sql"]
