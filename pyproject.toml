[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-foundation"
version = "0.1.0.dev0"
description = "Executable planning scaffold for evidence-backed, domain-neutral matter assessments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
matter = "matter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
