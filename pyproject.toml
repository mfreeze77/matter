[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-foundation"
version = "0.1.0.dev1"
description = "Portable contracts and planning tools for evidence-backed, domain-neutral matter assessments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.scripts]
matter = "matter.__main__:main"

[tool.setuptools]
packages = ["matter", "matter._schemas"]

[tool.setuptools.package-dir]
"" = "src"
"matter._schemas" = "schemas"

[tool.setuptools.package-data]
"matter._schemas" = ["*.schema.json"]
